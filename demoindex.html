<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Gaussian Splat Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
      height: 100%;
    }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #eee;
      font-family: sans-serif;
      font-size: 16px;
      z-index: 10;
    }
  </style>

  <!-- three.js と spark.js をCDNから読み込む -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="loading">読み込み中...</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

    // ==== ここだけ書き換えればOK ====
    // Scaniverseから書き出した .spz ファイルのパス（同じフォルダに置く場合はファイル名だけでよい）
    const SPLAT_URL = "./demo.spz";
    // ================================

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.01,
      1000
    );
    camera.position.set(0, 0, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Sparkのレンダラーをシーンに追加(スプラットの描画を担当)
    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    // マウス/タッチでの視点操作
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = true;
    controls.screenSpacePanning = true; // 画面に対して平行にパンする(3Dモデル閲覧向け)

    // スプラットの読み込み
    const loadingEl = document.getElementById("loading");
    const splat = new SplatMesh({
      url: SPLAT_URL,
      onLoad: () => {
        loadingEl.style.display = "none";

        // モデル全体のバウンディングボックスを計算して中心を求める
        const box = new THREE.Box3().setFromObject(splat);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1;

        // カメラとコントロールのターゲットを、モデルの中心に合わせる
        controls.target.copy(center);
        camera.position.set(
          center.x,
          center.y,
          center.z + radius * 2.5 // モデルの大きさに応じて距離を自動調整
        );
        camera.near = Math.max(radius * 0.01, 0.001);
        camera.far = radius * 100;
        camera.updateProjectionMatrix();
        controls.update();
      },
    });

    // SPZは標準でThree.jsと同じRUB座標系のため、通常は回転不要
    // 向きがおかしい場合はここを調整（例: X軸180度なら (1,0,0,0)、Z軸180度なら (0,0,1,0)）
    splat.quaternion.set(0, 0, 0, 1);
    scene.add(splat);

    // ウィンドウリサイズ対応
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 描画ループ
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
