<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Gassan Panorama Curved Panel</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #000">
      <!-- 前方に湾曲したパノラマパネル -->
      <a-curvedimage
        src="P-jyubuichi1.jpg"
        radius="5"
        theta-length="140"
        height="3"
        position="0 0 0"
        rotation="0 0 0">
      </a-curvedimage>

      <a-camera look-controls="true"></a-camera>
    </a-scene>
  </body>
</html>
