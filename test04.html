<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Gassan Panorama Immersive</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- 半球状に近い形で背景にパノラマを貼る -->
      <a-sky 
        src="P-jyubuichi1.jpg" 
        radius="10"
        phi-start="0"
        phi-length="240"
        theta-start="-90"
        theta-length="100"
        rotation="0 0 0">
      </a-sky>

      <a-camera look-controls="true"></a-camera>
    </a-scene>
  </body>
</html>
