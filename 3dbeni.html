<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>3Dモデル表示（GLB + USDZ対応）</title>
    <!-- Googleの3D表示ライブラリ -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #f5f5f5;
      }
      model-viewer {
        width: 100%;
        max-width: 600px;
        height: 500px;
        background-color: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      }
    </style>
  </head>
  <body>
    <h1>iPhoneの方は右下の小さなアイコンをクリックしてください。</h1>
    <!-- model-viewerが端末に応じてGLB / USDZを自動切り替え -->
    <model-viewer 
      src="3dbeni.glb"
      ios-src="3dbeni.usdz"
      alt="3Dモデル"
      camera-controls
      auto-rotate
      ar
      ar-modes="webxr scene-viewer quick-look"
      style="width:100%; height:100%;">
    </model-viewer>
  </body>
</html>
